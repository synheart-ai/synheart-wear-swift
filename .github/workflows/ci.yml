name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A new push to a PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Read-only token: these jobs only check out, build and test.
permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "xcode=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Verify no Garmin overlay symlinks committed
        run: make verify-clean
      # Compiled dependencies (grpc-swift, SwiftNIO, swift-protobuf) are most
      # of the build time. Keyed on the toolchain and Package.resolved, so a
      # new Xcode or a dependency bump starts clean.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved') }}
      - name: Build and test
        run: swift test
