version: 2

multi-ecosystem-groups:
  dependency-updates:
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Africa/Addis_Ababa

updates:
  - package-ecosystem: swift
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: dependency-updates
    ignore:
      - dependency-name: "github.com/grpc/grpc-swift"
        versions: [">= 2.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: dependency-updates
